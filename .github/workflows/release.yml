name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Free up disk space in runner
        uses: ./.github/actions/disk-cleanup

      - uses: actions/setup-java@v5
        with:
          java-version: "21"
          distribution: temurin

      - uses: gradle/actions/setup-gradle@v6

      - name: Copy CI gradle.properties
        run: cp gradle.properties.docker "$GRADLE_USER_HOME/gradle.properties"

      # The debug build signs with Android Studio's default keystore, which a fresh runner lacks.
      - name: Create debug keystore
        run: |
          mkdir -p ~/.android
          keytool -genkeypair -keystore ~/.android/debug.keystore -storepass android -keypass android \
            -alias androiddebugkey -dname "CN=Android Debug,O=Android,C=US" -keyalg RSA -keysize 2048 -validity 10000

      # versionName is <canonicalVersionName>-<mollyRevision>; 8.19.2-4 is tagged v8.19.2-4.
      - name: Check tag matches versionName
        run: |
          version="$(sed -n 's/^val canonicalVersionName = "\(.*\)"/\1/p' app/build.gradle.kts)-$(sed -n 's/^val mollyRevision = \([0-9]*\)/\1/p' app/build.gradle.kts)"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match versionName $version"
            exit 1
          fi

      - name: Set up signing key
        env:
          KEY_STORE_BASE64: ${{ secrets.KEY_STORE_BASE64 }}
          KEY_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          ALIAS: ${{ secrets.ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          for name in KEY_STORE_BASE64 KEY_STORE_PASSWORD ALIAS KEY_PASSWORD; do
            if [ -z "$(printenv "$name")" ]; then
              echo "::error::Repository secret $name is not set"
              exit 1
            fi
          done
          echo "$KEY_STORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"

      - name: Test and build release APK
        env:
          CI_KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          CI_KEYSTORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          CI_KEYSTORE_ALIAS: ${{ secrets.ALIAS }}
          CI_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew :app:testProdWebsiteDebugUnitTest :app:assembleProdWebsiteRelease

      - name: Verify signature
        run: |
          apksigner=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -n1)
          "$apksigner" verify --print-certs app/build/outputs/apk/prodWebsite/release/app-prod-website-release.apk

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          apk="$GITHUB_WORKSPACE/molly_${GITHUB_REF_NAME#v}.apk"
          mv app/build/outputs/apk/prodWebsite/release/app-prod-website-release.apk "$apk"
          gh release create "$GITHUB_REF_NAME" "$apk" --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes

      - name: Remove signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"
