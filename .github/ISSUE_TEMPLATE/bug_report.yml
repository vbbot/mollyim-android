name: Bug report
description: Report something that doesn't work
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: What happened
      placeholder: The chat list doesn't scroll with the scroll wheel.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open a chat
        2. Tap the call button
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: App version
      placeholder: v8.19.2-4
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Device
      placeholder: Light Phone III
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Output of `adb logcat`, if you can get it. Remove phone numbers first.
      render: text
